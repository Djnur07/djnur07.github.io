<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collections · Mochi Friend</title>
  </head>
  <body data-page="collections">
    <header id="site-header"></header>
    <main id="app" class="collections-page">
      <div class="collections-head">
        <span class="eyebrow">Collections</span>
        <h1>Works by @ZelythMochi</h1>
      </div>
      <div class="collection-cards">
        <a class="collection-card" href="/mochi/">
          <img src="/legendary/thumbs/636.png" alt="" width="400" height="400" />
          <span class="card-body">
            <span class="card-title">Mochi Friend</span>
            <span class="card-text">Cozy chibi keepers and their Legendary one-of-ones.</span>
          </span>
        </a>
        <a class="collection-card" href="/chibi/">
          <img src="/chibi/thumbs/bandana-bee.png" alt="" width="400" height="400" />
          <span class="card-body">
            <span class="card-title">Chibi</span>
            <span class="card-text">Little risograph characters: gardeners, fairies, pirates and more.</span>
          </span>
        </a>
        <a class="collection-card" href="/muse/">
          <img src="/muse/thumbs/muse-dreaming.png" alt="" width="400" height="400" />
          <span class="card-body">
            <span class="card-title">Muse <span class="card-tag">Animation</span></span>
            <span class="card-text">Animated code-art portraits, each a quiet little moment.</span>
          </span>
        </a>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>

</html>
