<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mochi Friend</title>
  </head>
  <body data-page="home">
    <header id="site-header"></header>
    <main id="app" class="split">
      <section class="split-text">
        <span class="eyebrow">A collection by @Dzany_Mochi</span>
        <h1 class="display">Mochi Friend</h1>
        <p class="lead">Cozy chibi keepers, each hugging their own little mochi friend.</p>
        <div class="actions">
          <a class="btn btn--primary" href="/collections/">Explore collections</a>
          <a class="btn" href="/mochi/">Mochi Friend</a>
        </div>
        <aside class="notice" role="note" aria-label="Account notice">
          <strong class="notice-title">Our new X account: @Dzany_Mochi</strong>
          <p class="notice-text">Our previous X account @ZelythMochi was hacked. Please ignore any DMs or links from it, and follow <a href="https://x.com/Dzany_Mochi" target="_blank" rel="noopener">@Dzany_Mochi</a> for updates.</p>
        </aside>
      </section>
      <figure class="split-media">
        <video class="hero-video" src="/home/mochi-hero.mp4" poster="/home/mochi-hero-poster.png"
               autoplay muted loop playsinline preload="auto" width="1080" height="1080"
               aria-label="Witch and her Mochi friends floating and bouncing"></video>
        <figcaption>Witch and friends · Mochi Friend</figcaption>
      </figure>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
